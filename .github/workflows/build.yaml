name: build

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build application
        run: ./scripts/build-app.sh

      - name: Upload application
        uses: actions/upload-artifact@v6
        with:
          name: Whoops
          path: dist/Whoops.app
          if-no-files-found: error
